# Arc 5: Napoleonic France expansion

id = "napoleonic_france_scenario"
number = 5
status = "ready"
aggressor = "FRA"
key = "napoleonic_france"

targets = { a = ["BEL", "HOL", "LUX"] }

notes = """
The non-historical arc: France leaves the Third Republic behind, restores an
empire, and presses its natural borders into the Low Countries. A single target
set (BEL, HOL, LUX) means no variant roll; the ladder releases claims and
incidents at the crises rung and ultimatums plus join offers at peak. Join
offers are filtered to states on France's continent that share its government.
"""

suppress = [
  "FRA_giraud_plan",
  "FRA_radicalize_front",
  "FRA_status_quo",
  "FRA_far_right_leagues",
  "FRA_support_the_legitimatises",
  "FRA_side_with_the_orleanists"
]

[ladder]
crises_at_month = 14
peak_at_month = 30
crises_func = "sandbox_fire_napoleonic_france_crises"
peak_func = "sandbox_fire_napoleonic_france_peak"

[joiners]
select = "top_n_by_scorer"
n = 2
invite_event = "sandbox_napoleonic_france.4"
require = ["same_ideology", "same_continent"]

[[paths]]
variants = ["a"]
focuses = [
  "FRA_the_new_continental_system",
  "FRA_army_reform"
]
