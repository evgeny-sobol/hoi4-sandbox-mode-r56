 sandbox_axis_1_t: "Unrest in the Sudetenland"
 sandbox_axis_1_d: "Reports from Prague speak of German demonstrators clashing with Czech police in the border districts. Our brethren across the frontier look to Berlin for protection. The Foreign Ministry asks for guidance: press the claims, or let the matter cool down?"
 sandbox_axis_1_a: "Press our claims"
 sandbox_axis_1_b: "Let it cool down"
 sandbox_axis_2_t: "German Demands over Danzig"
 sandbox_axis_2_d: "Berlin demands the return of Danzig and extraterritorial transit across the Corridor. The note speaks of German honor and carries an unmistakable threat of war. The cabinet must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_axis_2_a: "Yield to the demands"
 sandbox_axis_2_b: "Defy Berlin"
 sandbox_axis_3_t: "Berlin Demands the Sudetenland"
 sandbox_axis_3_d: "Germany demands immediate autonomy, then annexation, of the Sudeten districts. The note promises peace if we comply and ruin if we refuse. Paris and London counsel restraint, but the army swears it can hold the frontier forts. The republic must choose."
 sandbox_axis_3_a: "Accept the terms"
 sandbox_axis_3_b: "We will fight"
 sandbox_axis_4_t: "An Alliance with Germany?"
 sandbox_axis_4_d: "Berlin proposes a formal military alliance and wants us at its side when Europe goes up in flames. Our diplomats report that Germany will soon move against its neighbors. We must decide where our future lies."
 sandbox_axis_4_a: "Join Germany"
 sandbox_axis_4_b: "Stay out of it"
 scenario_ally: "Scenario ally"
 sandbox_axis_faction: "Axis"
 sandbox_soviet_1_t: "Trouble on the Western Frontier"
 sandbox_soviet_1_d: "Reports from the border speak of oppressed Belorussian and Ukrainian workers clashing with Polish police in the Kresy, while Finnish engineers raise new concrete across Karelia. The comrades across the frontier look to Moscow for protection. The Commissariat asks for guidance: press our claims, or let the matter cool down?"
 sandbox_soviet_1_a: "Press our claims"
 sandbox_soviet_1_b: "Let it cool down"
 sandbox_soviet_2_t: "Soviet Demands over the Kresy"
 sandbox_soviet_2_d: "Moscow demands the return of the Western Belorussian and Ukrainian lands seized in 1921, with Red Army transit rights to enforce the peace. The note speaks of liberating our brothers and carries an unmistakable threat of war. The cabinet must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_soviet_2_a: "Yield to the demands"
 sandbox_soviet_2_b: "Defy Moscow"
 sandbox_soviet_3_t: "Moscow Demands Karelia"
 sandbox_soviet_3_d: "The Soviet Union demands the Karelian Isthmus, Petsamo, and a lease on Hangoe to secure Leningrad. The note promises peace if we comply and ruin if we refuse. Stockholm counsels restraint, but the army swears it can hold the Mannerheim Line. The republic must choose."
 sandbox_soviet_3_a: "Accept the terms"
 sandbox_soviet_3_b: "We will fight"
 sandbox_soviet_4_t: "An Alliance with the Soviet Union?"
 sandbox_soviet_4_d: "Moscow proposes a formal military alliance and wants us at its side when Europe goes up in flames. Our diplomats report that the Soviet Union will soon move against its neighbors. We must decide where our future lies."
 sandbox_soviet_4_a: "Join the Soviet Union"
 sandbox_soviet_4_b: "Stay out of it"
 sandbox_soviet_faction: "Comintern"
 sandbox_japanese_1_t: "The China Incident"
 sandbox_japanese_1_d: "Shots were exchanged between our garrison and Chinese troops at the Marco Polo Bridge, and the Kwantung Army reports Chinese reinforcements pouring into Hebei. The hardliners demand a punitive expedition; the Foreign Ministry urges negotiation. The cabinet must decide: press the incident to a settlement, or let it cool down?"
 sandbox_japanese_1_a: "Press our claims"
 sandbox_japanese_1_b: "Let it cool down"
 sandbox_japanese_2_t: "Tokyo Demands North China"
 sandbox_japanese_2_d: "Tokyo demands the demilitarisation of Hebei, recognition of Manchukuo, and Japanese garrisons across North China. The note speaks of Asian co-prosperity and carries an unmistakable threat of war. The government must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_japanese_2_a: "Yield to the demands"
 sandbox_japanese_2_b: "Defy Tokyo"
 sandbox_japanese_3_t: "Tokyo Demands the Philippines"
 sandbox_japanese_3_d: "Japan demands the neutrality of the Philippines and basing rights for the Imperial Navy, calling us the barrier that guards their southern flank. The note promises peace if we comply and ruin if we refuse. Washington counsels restraint, but the army swears it can hold the islands. The Commonwealth must choose."
 sandbox_japanese_3_a: "Accept the terms"
 sandbox_japanese_3_b: "We will fight"
 sandbox_japanese_4_t: "An Alliance with Japan?"
 sandbox_japanese_4_d: "Tokyo proposes a formal military alliance and wants us at its side when the Pacific goes up in flames. Our diplomats report that Japan will soon move against its neighbors. We must decide where our future lies."
 sandbox_japanese_4_a: "Join Japan"
 sandbox_japanese_4_b: "Stay out of it"
 sandbox_japanese_faction: "Co-Prosperity"
 sandbox_italian_1_t: "Incident at the Adriatic"
 sandbox_italian_1_d: "Our consul in Zara reports Yugoslav irregulars clashing with Italian sailors ashore, and Greek customs vessels are said to be arming smugglers along our Albanian coast. The Grand Council demands a firm hand; the Foreign Ministry urges restraint. The Duce must decide: press our claims, or let the matter cool down?"
 sandbox_italian_1_a: "Press our claims"
 sandbox_italian_1_b: "Let it cool down"
 sandbox_italian_2_t: "Rome Demands the Adriatic"
 sandbox_italian_2_d: "Rome demands Dalmatia, the cession of the Kvarner islands, and a demilitarised frontier across the Dinaric Alps. The note speaks of Italy's civilising mission and carries an unmistakable threat of war. The government must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_italian_2_a: "Yield to the demands"
 sandbox_italian_2_b: "Defy Rome"
 sandbox_italian_3_t: "Rome Demands the Ionian Islands"
 sandbox_italian_3_d: "Italy demands the Ionian Islands and a protectorate over Albania to secure 'the mare nostrum'. The note promises peace if we comply and ruin if we refuse. London counsels restraint, but the army swears it can hold the Metaxas Line. The kingdom must choose."
 sandbox_italian_3_a: "Accept the terms"
 sandbox_italian_3_b: "We will fight"
 sandbox_italian_4_t: "An Alliance with Italy?"
 sandbox_italian_4_d: "Rome proposes a formal military alliance and wants us at its side when the Mediterranean goes up in flames. Our diplomats report that Italy will soon move against its neighbors. We must decide where our future lies."
 sandbox_italian_4_a: "Join Italy"
 sandbox_italian_4_b: "Stay out of it"
 sandbox_italian_faction: "Mare Nostrum"
 sandbox_britain_1_t: "The New Order"
 sandbox_britain_1_d: "Blackshirt rallies have filled Whitehall's streets, and the party papers now speak openly of a 'new imperial order' that must be imposed on Europe and the East. The Cabinet demands a firm hand on the Continent; the Foreign Office urges restraint. The Leader must decide: press our claims, or let the matter cool down?"
 sandbox_britain_1_a: "Press our claims"
 sandbox_britain_1_b: "Let it cool down"
 sandbox_britain_2_t: "London Demands the Channel Coast"
 sandbox_britain_2_d: "London demands the demilitarisation of the Channel coast, the return of the Channel Islands on imperial terms, and a British hand in the ports of the Atlantic. The note speaks of the manifest destiny of the English-speaking peoples and carries an unmistakable threat of war. The republic must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_britain_2_a: "Yield to the demands"
 sandbox_britain_2_b: "Defy London"
 sandbox_britain_3_t: "London Demands the Interior Line"
 sandbox_britain_3_d: "Britain demands that the Soviet Union withdraw from the Baltic and Black Sea littorals and accept British arbitration over the 'spheres of civilisation'. The note promises peace if we comply and ruin if we refuse. Washington counsels restraint, but the Red Army swears it can hold the line. The Union must choose."
 sandbox_britain_3_a: "Accept the terms"
 sandbox_britain_3_b: "We will fight"
 sandbox_britain_4_t: "An Alliance with Britain?"
 sandbox_britain_4_d: "London proposes a formal military alliance and wants us at its side when the old order burns. Our diplomats report that Britain will soon move against its neighbors. We must decide where our future lies."
 sandbox_britain_4_a: "Join Britain"
 sandbox_britain_4_b: "Stay out of it"
 sandbox_britain_faction: "New Empire"
 sandbox_red_america_1_t: "The World Revolution"
 sandbox_red_america_1_d: "From Seattle to Buffalo the red flag is flying at factory gates, and the Commissar of the Interior now speaks of carrying the revolution to the Dominion and across the Pacific. The Secretariat demands a firm hand on the hemisphere; the Foreign Bureau urges restraint. The Chairman must decide: press our claims, or let the matter cool down?"
 sandbox_red_america_1_a: "Press our claims"
 sandbox_red_america_1_b: "Let it cool down"
 sandbox_red_america_2_t: "Washington Demands the Dominion"
 sandbox_red_america_2_d: "Washington demands the demilitarisation of the border, a peoples' congress in Ottawa, and the dissolution of the imperial ties to London. The note speaks of the inevitable victory of labour and carries an unmistakable threat of war. The government must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_red_america_2_a: "Yield to the demands"
 sandbox_red_america_2_b: "Defy Washington"
 sandbox_red_america_3_t: "Washington Demands the Pacific"
 sandbox_red_america_3_d: "America demands the neutrality of the Japanese home islands, the evacuation of the mandated islands, and workers' control over the arsenals of the Pacific. The note promises peace if we comply and ruin if we refuse. The army swears it can hold the home islands. The Empire must choose."
 sandbox_red_america_3_a: "Accept the terms"
 sandbox_red_america_3_b: "We will fight"
 sandbox_red_america_4_t: "An Alliance with America?"
 sandbox_red_america_4_d: "Washington proposes a formal military alliance and wants us at its side when the old order burns. Our diplomats report that America will soon move against the imperialists. We must decide where our future lies."
 sandbox_red_america_4_a: "Join America"
 sandbox_red_america_4_b: "Stay out of it"
 sandbox_red_america_faction: "People's Internationale"
 sandbox_france_1_t: "The Rhine Question"
 sandbox_france_1_d: "From the Palatinate to the Ruhr, newspapers in Paris have begun to speak of France's natural frontiers, and the War Ministry has quietly reopened the fortifications along the Rhine. The Chamber demands a firm hand on the eastern border; the Quai d'Orsay urges restraint. The President must decide: press our claims, or let the matter cool down?"
 sandbox_france_1_a: "Press our claims"
 sandbox_france_1_b: "Let it cool down"
 sandbox_france_2_t: "Paris Demands the Rhine"
 sandbox_france_2_d: "Paris demands the demilitarisation of the Rhineland, the return of Alsace-Lorraine on French terms, and a protectorate over the Saar. The note speaks of the natural frontiers of civilisation and carries an unmistakable threat of war. The government must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_france_2_a: "Yield to the demands"
 sandbox_france_2_b: "Defy Paris"
 sandbox_france_3_t: "Paris Demands the Alps"
 sandbox_france_3_d: "France demands the cession of Savoy and Nice, the demilitarisation of the Alps, and Corsica's neutrality in the coming conflict. The note promises peace if we comply and ruin if we refuse. The Duce counsels restraint, but the army swears it can hold the passes. The kingdom must choose."
 sandbox_france_3_a: "Accept the terms"
 sandbox_france_3_b: "We will fight"
 sandbox_france_4_t: "An Alliance with France?"
 sandbox_france_4_d: "Paris proposes a formal military alliance and wants us at its side when the old order on the Continent burns. Our diplomats report that France will soon move against its neighbors. We must decide where our future lies."
 sandbox_france_4_a: "Join France"
 sandbox_france_4_b: "Stay out of it"
 sandbox_france_faction: "Continental System"
 sandbox_habsburg_1_t: "The Habsburg Question"
 sandbox_habsburg_1_d: "From Szeklerland to the Carpathians, the revanchist clubs are calling for the return of the Crown of Saint Stephen, and the officer corps has begun drilling for a march on the former crown lands. The Regency demands a firm hand on our historic borders; the Foreign Ministry urges restraint. The Regent must decide: press our claims, or let the matter cool down?"
 sandbox_habsburg_1_a: "Press our claims"
 sandbox_habsburg_1_b: "Let it cool down"
 sandbox_habsburg_2_t: "Budapest Demands the Highlands"
 sandbox_habsburg_2_d: "Budapest demands the return of the Slovak and Ruthenian highlands, a customs union with Prague, and the restoration of the historic border on the Morava. The note speaks of the thousand-year crown and carries an unmistakable threat of war. The republic must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_habsburg_2_a: "Yield to the demands"
 sandbox_habsburg_2_b: "Defy Budapest"
 sandbox_habsburg_3_t: "Budapest Demands Transylvania"
 sandbox_habsburg_3_d: "Hungary demands the return of Northern Transylvania and the Szeklerland, the restoration of Hungarian property rights, and a guarantee of the Magyar minority. The note promises peace if we comply and ruin if we refuse. Bucharest counsels restraint, but the army swears it can hold the Carpathians. The kingdom must choose."
 sandbox_habsburg_3_a: "Accept the terms"
 sandbox_habsburg_3_b: "We will fight"
 sandbox_habsburg_4_t: "An Alliance with Hungary?"
 sandbox_habsburg_4_d: "Budapest proposes a formal military alliance and wants us at its side when the Danube burns. Our diplomats report that Hungary will soon move against its neighbors. We must decide where our future lies."
 sandbox_habsburg_4_a: "Join Hungary"
 sandbox_habsburg_4_b: "Stay out of it"
 sandbox_habsburg_faction: "Danubian Empire"

 sandbox_axis_5_t: "Unrest in the West"
 sandbox_axis_5_d: "From the Rhine to the Atlantic, the papers speak of France's and Britain's encirclement of the Reich. The War Ministry demands a free hand in the West; the Foreign Ministry urges restraint. The Fuehrer must decide: press our claims, or let the matter cool down?"
 sandbox_axis_5_a: "Press our claims"
 sandbox_axis_5_b: "Let it cool down"
 sandbox_axis_6_t: "Berlin Demands the West"
 sandbox_axis_6_d: "Berlin demands the return of the Rhineland, Alsace-Lorraine, and a free hand on the Channel coast. The note speaks of German honor and carries an unmistakable threat of war. The republic must answer: yield to the pressure, or defy it and brace the nation for what follows?"
 sandbox_axis_6_a: "Yield to the demands"
 sandbox_axis_6_b: "Defy them"
 sandbox_axis_7_t: "Berlin Demands the Fleet"
 sandbox_axis_7_d: "Germany demands the return of overseas bases and a say in the Atlantic convoys. The note promises peace if we comply and ruin if we refuse. London counsels restraint, but the Admiralty swears it can hold the sea lanes. The Empire must choose."
 sandbox_axis_7_a: "Yield to the demands"
 sandbox_axis_7_b: "Defy them"
 sandbox_soviet_5_t: "Trouble on the Western Frontier"
 sandbox_soviet_5_d: "Reports from the border speak of capitalist encirclement tightening from Prague to Sofia. The Commissariat demands a firm hand in the West; the Foreign Bureau urges restraint. Moscow must decide: press our claims, or let the matter cool down?"
 sandbox_soviet_5_a: "Press our claims"
 sandbox_soviet_5_b: "Let it cool down"
 sandbox_soviet_6_t: "Moscow Demands the West"
 sandbox_soviet_6_d: "Moscow demands the demilitarisation of the Bohemian border and a Red Army presence in the Balkans. The note speaks of proletarian solidarity and carries an unmistakable threat of war. The republic must answer: yield, or brace for what follows?"
 sandbox_soviet_6_a: "Yield to the demands"
 sandbox_soviet_6_b: "Defy them"
 sandbox_soviet_7_t: "Moscow Demands the Balkans"
 sandbox_soviet_7_d: "The Soviet Union demands the Black Sea coast and the surrender of the Balkan reactionaries. The note promises peace if we comply and ruin if we refuse. The kingdom must choose."
 sandbox_soviet_7_a: "Yield to the demands"
 sandbox_soviet_7_b: "Defy them"
 sandbox_japanese_5_t: "The Southern Question"
 sandbox_japanese_5_d: "From Rangoon to Batavia, the Southern Resources Area is the talk of Tokyo. The Navy demands the northern oil and rubber; the Foreign Ministry urges a gentler hand. The cabinet must decide: press our claims, or let the matter cool down?"
 sandbox_japanese_5_a: "Press our claims"
 sandbox_japanese_5_b: "Let it cool down"
 sandbox_japanese_6_t: "Tokyo Demands Burma"
 sandbox_japanese_6_d: "Japan demands the Irrawaddy delta, the northern railways, and a share of the teak and oil. The note speaks of Asian co-prosperity and carries an unmistakable threat of war. The Government must answer: yield, or brace for what follows?"
 sandbox_japanese_6_a: "Yield to the demands"
 sandbox_japanese_6_b: "Defy them"
 sandbox_japanese_7_t: "Tokyo Demands the Indies"
 sandbox_japanese_7_d: "Japan demands the oilfields and ports of the East Indies. The note promises peace if we comply and ruin if we refuse. The colonial office counsels restraint, but the Navy swears it can take the islands. The colony must choose."
 sandbox_japanese_7_a: "Yield to the demands"
 sandbox_japanese_7_b: "Defy them"
 sandbox_italian_5_t: "The Western Question"
 sandbox_italian_5_d: "From Nice to Malta, the Western powers block our path. The Grand Council demands a free hand against France and perfidious Albion; the Foreign Ministry urges patience. The Duce must decide: press our claims, or let the matter cool down?"
 sandbox_italian_5_a: "Press our claims"
 sandbox_italian_5_b: "Let it cool down"
 sandbox_italian_6_t: "Rome Demands the West"
 sandbox_italian_6_d: "Rome demands Corsica, Nice, Savoy, and the old claims against France. The note speaks of Italy's rightful place and carries an unmistakable threat of war. The republic must answer: yield, or brace for what follows?"
 sandbox_italian_6_a: "Yield to the demands"
 sandbox_italian_6_b: "Defy them"
 sandbox_italian_7_t: "Rome Demands the Mediterranean"
 sandbox_italian_7_d: "Italy demands Malta, the Aegean, and the mastery of the middle sea. The note promises peace if we comply and ruin if we refuse. Britain must choose: hand over the islands, or fight for the waves."
 sandbox_italian_7_a: "Yield to the demands"
 sandbox_italian_7_b: "Defy them"
 sandbox_britain_5_t: "The Continental Threat"
 sandbox_britain_5_d: "From Berlin to Rome, the fascist powers grow bolder. The War Office demands a decisive strike to break the Axis before it is ready; the Foreign Office urges one more year of peace. The Cabinet must decide: press our claims, or let the matter cool down?"
 sandbox_britain_5_a: "Press our claims"
 sandbox_britain_5_b: "Let it cool down"
 sandbox_britain_6_t: "London Demands the Ruhr"
 sandbox_britain_6_d: "London demands the demilitarisation of the Rhineland and a British hand in the Ruhr. The note speaks of the balance of power and carries an unmistakable threat of war. The Reich must answer: yield, or brace for what follows?"
 sandbox_britain_6_a: "Yield to the demands"
 sandbox_britain_6_b: "Defy them"
 sandbox_britain_7_t: "London Demands the Adriatic"
 sandbox_britain_7_d: "Britain demands the demilitarisation of the Italian coast and a halt to the Balkan adventurism. The note promises peace if we comply and ruin if we refuse. Italy must choose: curb the ambitions, or fight."
 sandbox_britain_7_a: "Yield to the demands"
 sandbox_britain_7_b: "Defy them"
 sandbox_red_america_5_t: "The Two Camps"
 sandbox_red_america_5_d: "The revolution faces two roads: the imperialist camp in London and the bureaucrat camp in Moscow. The Secretariat demands a firm hand against both; the Foreign Bureau urges caution. The Chairman must decide: press our claims, or let the matter cool down?"
 sandbox_red_america_5_a: "Press our claims"
 sandbox_red_america_5_b: "Let it cool down"
 sandbox_red_america_6_t: "Washington Demands the Empire"
 sandbox_red_america_6_d: "Washington demands the dissolution of the British Empire and a peoples' congress from Ottawa to Delhi. The note speaks of world revolution and carries an unmistakable threat of war. The Empire must answer: yield, or brace for what follows?"
 sandbox_red_america_6_a: "Yield to the demands"
 sandbox_red_america_6_b: "Defy them"
 sandbox_red_america_7_t: "Washington Demands the Union"
 sandbox_red_america_7_d: "America demands that the Soviet Union join the world revolution or stand aside. The note promises peace if we comply and ruin if we refuse. The Union must choose: unite the workers, or be swept aside."
 sandbox_red_america_7_a: "Yield to the demands"
 sandbox_red_america_7_b: "Defy them"
 sandbox_france_5_t: "The Albion Question"
 sandbox_france_5_d: "From the Channel to the Atlantic, the old enemy still blocks the continent. The Government demands a reckoning with Albion; the Quai d'Orsay urges restraint. Paris must decide: press our claims, or let the matter cool down?"
 sandbox_france_5_a: "Press our claims"
 sandbox_france_5_b: "Let it cool down"
 sandbox_france_6_t: "Paris Demands the Channel"
 sandbox_france_6_d: "France demands the Channel Islands, the neutralisation of the coast, and a French hand in the Atlantic. The note speaks of natural borders and carries an unmistakable threat of war. The Empire must answer: yield, or brace for what follows?"
 sandbox_france_6_a: "Yield to the demands"
 sandbox_france_6_b: "Defy them"
 sandbox_habsburg_5_t: "The Danube Question"
 sandbox_habsburg_5_d: "From Belgrade to Ljubljana, the crown lands of Saint Stephen still lie outside the Kingdom. The Regency demands their return; the Foreign Ministry urges patience. Budapest must decide: press our claims, or let the matter cool down?"
 sandbox_habsburg_5_a: "Press our claims"
 sandbox_habsburg_5_b: "Let it cool down"
 sandbox_habsburg_6_t: "Budapest Demands the South"
 sandbox_habsburg_6_d: "Hungary demands the Banat, the Vojvodina, and the historic southern marches. The note speaks of the thousand-year crown and carries an unmistakable threat of war. The Kingdom must answer: yield, or brace for what follows?"
 sandbox_habsburg_6_a: "Yield to the demands"
 sandbox_habsburg_6_b: "Defy them"
 sandbox_habsburg_7_t: "Budapest Demands the Alps"
 sandbox_habsburg_7_d: "Hungary demands the Slovene lands and a corridor to the Adriatic. The note promises peace if we comply and ruin if we refuse. Slovenia must choose: join the crown, or fight."
 sandbox_habsburg_7_a: "Yield to the demands"
 sandbox_habsburg_7_b: "Defy them"

 sandbox_ger_atl_1_t: "The Atlantic Question"
 sandbox_ger_atl_1_d: "From the Channel to the mid-ocean, Britain and America block the German flag. The Navy demands a free hand on the waves; the Foreign Ministry urges patience. Berlin must decide: press our claims, or let the matter cool down?"
 sandbox_ger_atl_1_a: "Press our claims"
 sandbox_ger_atl_1_b: "Let it cool down"
 sandbox_ger_atl_2_t: "Berlin Demands the Channel"
 sandbox_ger_atl_2_d: "Berlin demands the surrender of the Channel fleet and a German hand in the Atlantic convoys. The note speaks of Germany's destiny and carries an unmistakable threat of war. England must answer: yield, or brace for what follows?"
 sandbox_ger_atl_2_a: "Yield to the demands"
 sandbox_ger_atl_2_b: "Defy them"
 sandbox_ger_atl_3_t: "Berlin Demands the Ocean"
 sandbox_ger_atl_3_d: "Germany demands a share of the Pacific bases and the neutrality of the American fleet. The note promises peace if we comply and ruin if we refuse. America must choose: hand over the bases, or face the High Seas Fleet."
 sandbox_ger_atl_3_a: "Yield to the demands"
 sandbox_ger_atl_3_b: "Defy them"
 sandbox_ger_me_1_t: "The Eastern Question"
 sandbox_ger_me_1_d: "From the Urals to the Gulf, the Reich eyes the road east. The General Staff demands a drive toward the oil and the East; the Foreign Ministry urges a steadier hand. Berlin must decide: press our claims, or let the matter cool down?"
 sandbox_ger_me_1_a: "Press our claims"
 sandbox_ger_me_1_b: "Let it cool down"
 sandbox_ger_me_2_t: "Berlin Demands the East"
 sandbox_ger_me_2_d: "Berlin demands the Ukraine, the Caucasus, and the oil of Baku. The note speaks of living space and carries an unmistakable threat of war. Moscow must answer: yield, or brace for what follows?"
 sandbox_ger_me_2_a: "Yield to the demands"
 sandbox_ger_me_2_b: "Defy them"
 sandbox_ger_me_3_t: "Berlin Demands Mesopotamia"
 sandbox_ger_me_3_d: "Germany demands the oilfields of Iraq and a protectorate over the Gulf. The note promises peace if we comply and ruin if we refuse. Iraq must choose: accept the German hand, or fight."
 sandbox_ger_me_3_a: "Yield to the demands"
 sandbox_ger_me_3_b: "Defy them"
 sandbox_sov_south_1_t: "The Southern Thrust"
 sandbox_sov_south_1_d: "From the Straits to the Gulf, the road south beckons the Red Army. The Commissariat demands a drive toward the warm seas; the Foreign Bureau urges a cautious step. Moscow must decide: press our claims, or let the matter cool down?"
 sandbox_sov_south_1_a: "Press our claims"
 sandbox_sov_south_1_b: "Let it cool down"
 sandbox_sov_south_2_t: "Moscow Demands the Straits"
 sandbox_sov_south_2_d: "Moscow demands the Turkish Straits and a naval base on the Aegean. The note speaks of the historical rights of the Slavs and carries an unmistakable threat of war. Turkey must answer: yield, or brace for what follows?"
 sandbox_sov_south_2_a: "Yield to the demands"
 sandbox_sov_south_2_b: "Defy them"
 sandbox_sov_south_3_t: "Moscow Demands Persia"
 sandbox_sov_south_3_d: "The Soviet Union demands the northern provinces of Persia and the oil of Abadan. The note promises peace if we comply and ruin if we refuse. Iran must choose: accept the Soviet hand, or fight."
 sandbox_sov_south_3_a: "Yield to the demands"
 sandbox_sov_south_3_b: "Defy them"
 sandbox_sov_east_1_t: "The Eastern Frontier"
 sandbox_sov_east_1_d: "From Vladivostok to the Amur, the Far East stirs. The Soviet command demands a reckoning with Japan and its Manchukuo puppet; the Politburo urges patience. Moscow must decide: press our claims, or let the matter cool down?"
 sandbox_sov_east_1_a: "Press our claims"
 sandbox_sov_east_1_b: "Let it cool down"
 sandbox_sov_east_2_t: "Moscow Demands the Kuriles"
 sandbox_sov_east_2_d: "Moscow demands the Kurile Islands and the northern half of Sakhalin. The note speaks of the old Russian claims and carries an unmistakable threat of war. Japan must answer: yield, or brace for what follows?"
 sandbox_sov_east_2_a: "Yield to the demands"
 sandbox_sov_east_2_b: "Defy them"
 sandbox_sov_east_3_t: "Moscow Demands Manchuria"
 sandbox_sov_east_3_d: "The Soviet Union demands the evacuation of Manchukuo and the restoration of Chinese sovereignty. The note promises peace if we comply and ruin if we refuse. The puppet must choose: dissolve, or be swept away."
 sandbox_sov_east_3_a: "Yield to the demands"
 sandbox_sov_east_3_b: "Defy them"
 sandbox_jap_north_1_t: "The Northern Path"
 sandbox_jap_north_1_d: "From the Amur to the Gobi, the northern frontier calls to the Imperial Army. The Kwantung clique demands a strike against the Soviet Union and its Mongolian satellite; the Navy urges the south instead. Tokyo must decide: press our claims, or let the matter cool down?"
 sandbox_jap_north_1_a: "Press our claims"
 sandbox_jap_north_1_b: "Let it cool down"
 sandbox_jap_north_2_t: "Tokyo Demands the North"
 sandbox_jap_north_2_d: "Tokyo demands the Amur frontier, the Trans-Siberian east of the Baikal, and the removal of the Soviet garrison. The note speaks of the divine mission and carries an unmistakable threat of war. Moscow must answer: yield, or brace for what follows?"
 sandbox_jap_north_2_a: "Yield to the demands"
 sandbox_jap_north_2_b: "Defy them"
 sandbox_jap_north_3_t: "Tokyo Demands Mongolia"
 sandbox_jap_north_3_d: "Japan demands the independence of Outer Mongolia under the Japanese sphere. The note promises peace if we comply and ruin if we refuse. Mongolia must choose: join the sphere, or be conquered."
 sandbox_jap_north_3_a: "Yield to the demands"
 sandbox_jap_north_3_b: "Defy them"
 sandbox_jap_old_1_t: "The Old Oppressors"
 sandbox_jap_old_1_d: "From the Pacific to the Atlantic, the old powers still hem in the Empire. The Admiralty demands a strike to break the Anglo-American ring; the civilian cabinet urges caution. Tokyo must decide: press our claims, or let the matter cool down?"
 sandbox_jap_old_1_a: "Press our claims"
 sandbox_jap_old_1_b: "Let it cool down"
 sandbox_jap_old_2_t: "Tokyo Demands the Pacific"
 sandbox_jap_old_2_d: "Tokyo demands the demilitarisation of the Pacific and the return of the old mandate. The note speaks of the liberation of Asia and carries an unmistakable threat of war. America must answer: yield, or brace for what follows?"
 sandbox_jap_old_2_a: "Yield to the demands"
 sandbox_jap_old_2_b: "Defy them"
 sandbox_jap_old_3_t: "Tokyo Demands the East"
 sandbox_jap_old_3_d: "Japan demands the evacuation of the British positions in Asia and the neutrality of the Indian Ocean. The note promises peace if we comply and ruin if we refuse. England must choose: withdraw, or face the combined fleet."
 sandbox_jap_old_3_a: "Yield to the demands"
 sandbox_jap_old_3_b: "Defy them"
 sandbox_ita_west_1_t: "The Western Enemy"
 sandbox_ita_west_1_d: "From the Alps to the Mediterranean, the Western powers still hold what Italy claims. The Grand Council demands a reckoning; the Foreign Ministry urges patience. Rome must decide: press our claims, or let the matter cool down?"
 sandbox_ita_west_1_a: "Press our claims"
 sandbox_ita_west_1_b: "Let it cool down"
 sandbox_ita_west_2_t: "Rome Demands the West"
 sandbox_ita_west_2_d: "Rome demands Corsica, Nice, Savoy, and the mastery of the western Mediterranean. The note speaks of the revival of the Roman eagle and carries an unmistakable threat of war. France must answer: yield, or brace for what follows?"
 sandbox_ita_west_2_a: "Yield to the demands"
 sandbox_ita_west_2_b: "Defy them"
 sandbox_ita_west_3_t: "Rome Demands the Sea"
 sandbox_ita_west_3_d: "Italy demands Malta, the Balearics, and the control of the central sea. The note promises peace if we comply and ruin if we refuse. England must choose: hand over the islands, or fight for the waves."
 sandbox_ita_west_3_a: "Yield to the demands"
 sandbox_ita_west_3_b: "Defy them"

 sandbox_ita_med_1_t: "The Mediterranean Empire"
 sandbox_ita_med_1_d: "From Anatolia to the Eternal City, the road to empire runs through the old Roman sea. The Grand Council demands a reckoning; the Foreign Ministry urges patience. Rome must decide: press our claims, or let the matter cool down?"
 sandbox_ita_med_1_a: "Press our claims"
 sandbox_ita_med_1_b: "Let it cool down"
 sandbox_ita_med_2_t: "Rome Demands the East"
 sandbox_ita_med_2_d: "Rome demands the Aegean and the Anatolian coast, restoring the Roman lake. The note speaks of the revival of the Roman eagle and carries an unmistakable threat of war. The East must answer: yield, or brace for what follows?"
 sandbox_ita_med_2_a: "Yield to the demands"
 sandbox_ita_med_2_b: "Defy them"
 sandbox_ita_med_3_t: "Rome Demands the West"
 sandbox_ita_med_3_d: "Rome demands Corsica, Nice, Savoy, and the mastery of the western Mediterranean. The note speaks of the revival of the Roman eagle and carries an unmistakable threat of war. The West must answer: yield, or brace for what follows?"
 sandbox_ita_med_3_a: "Yield to the demands"
 sandbox_ita_med_3_b: "Defy them"
 sandbox_eng_imperial_1_t: "The Empire Reborn"
 sandbox_eng_imperial_1_d: "From Delhi to the white dominions, the Crown asserts itself again. The Imperial Council demands the return of the dominions into the fold; the Cabinet hesitates. London must decide: press our claims, or let the matter cool down?"
 sandbox_eng_imperial_1_a: "Press our claims"
 sandbox_eng_imperial_1_b: "Let it cool down"
 sandbox_eng_imperial_2_t: "London Demands the Raj"
 sandbox_eng_imperial_2_d: "London demands the full integration of the Indian Empire under the Crown and the end of home-rule agitation. The note carries an unmistakable threat of war. India must answer: yield, or brace for what follows?"
 sandbox_eng_imperial_2_a: "Yield to the demands"
 sandbox_eng_imperial_2_b: "Defy them"
 sandbox_eng_imperial_3_t: "London Demands the Sphere"
 sandbox_eng_imperial_3_d: "London demands the re-alignment of the Anglo-Saxon world under one Crown. The note carries an unmistakable threat of war. The republics must answer: yield, or brace for what follows?"
 sandbox_eng_imperial_3_a: "Yield to the demands"
 sandbox_eng_imperial_3_b: "Defy them"
 sandbox_usa_warplan_1_t: "War Plan Rehearsal"
 sandbox_usa_warplan_1_d: "The Navy Board unrolls its war plans in the map room. From the Pacific to the Atlantic, the republic prepares to answer aggression with steel. Washington must decide: press our claims, or let the matter cool down?"
 sandbox_usa_warplan_1_a: "Press our claims"
 sandbox_usa_warplan_1_b: "Let it cool down"
 sandbox_usa_warplan_2_t: "Washington Demands the Pacific"
 sandbox_usa_warplan_2_d: "Washington demands the evacuation of the Pacific mandates and the end of the naval rivalry. The note carries an unmistakable threat of war. Tokyo must answer: yield, or brace for what follows?"
 sandbox_usa_warplan_2_a: "Yield to the demands"
 sandbox_usa_warplan_2_b: "Defy them"
 sandbox_usa_warplan_3_t: "Washington Demands the Ocean"
 sandbox_usa_warplan_3_d: "Washington demands the neutrality of the Atlantic sea lanes and the end of the entente. The note carries an unmistakable threat of war. London must answer: yield, or brace for what follows?"
 sandbox_usa_warplan_3_a: "Yield to the demands"
 sandbox_usa_warplan_3_b: "Defy them"
 sandbox_usa_hegemony_1_t: "The American Century"
 sandbox_usa_hegemony_1_d: "From the White House, America's destiny is written in steel and gold. The republic will not be contained by any empire, monarchy, or rising power. Washington must decide: press our claims, or let the matter cool down?"
 sandbox_usa_hegemony_1_a: "Press our claims"
 sandbox_usa_hegemony_1_b: "Let it cool down"
 sandbox_usa_hegemony_2_t: "Washington Demands the Order"
 sandbox_usa_hegemony_2_d: "Washington demands the dissolution of the old imperial order and the open door everywhere. The note carries an unmistakable threat of war. The empires must answer: yield, or brace for what follows?"
 sandbox_usa_hegemony_2_a: "Yield to the demands"
 sandbox_usa_hegemony_2_b: "Defy them"
 sandbox_usa_hegemony_3_t: "Washington Demands the Sphere"
 sandbox_usa_hegemony_3_d: "Washington demands the primacy of the American sphere over all challengers. The note carries an unmistakable threat of war. The rivals must answer: yield, or brace for what follows?"
 sandbox_usa_hegemony_3_a: "Yield to the demands"
 sandbox_usa_hegemony_3_b: "Defy them"
 sandbox_usa_hegemony_4_t: "Washington Demands the East"
 sandbox_usa_hegemony_4_d: "Washington demands the old monarchies lay down their crowns and join the democratic order. The note carries an unmistakable threat of war. The monarchists must answer: yield, or brace for what follows?"
 sandbox_usa_hegemony_4_a: "Yield to the demands"
 sandbox_usa_hegemony_4_b: "Defy them"
 sandbox_usa_hegemony_5_t: "Washington Demands the Pacific"
 sandbox_usa_hegemony_5_d: "Washington demands the neutrality of the Pacific and the end of the rising-sun menace. The note carries an unmistakable threat of war. Tokyo must answer: yield, or brace for what follows?"
 sandbox_usa_hegemony_5_a: "Yield to the demands"
 sandbox_usa_hegemony_5_b: "Defy them"
 sandbox_fra_monarchist_1_t: "The Legitimist Revival"
 sandbox_fra_monarchist_1_d: "The ancient rights of the Bourbons stir in French hearts from Madrid to Mexico. The legitimist court demands the restoration of the Latin world under France. Paris must decide: press our claims, or let the matter cool down?"
 sandbox_fra_monarchist_1_a: "Press our claims"
 sandbox_fra_monarchist_1_b: "Let it cool down"
 sandbox_fra_monarchist_2_t: "Paris Demands the Crown"
 sandbox_fra_monarchist_2_d: "Paris demands the crown of Spain and the return of the Iberian lands to the Latin union. The note carries an unmistakable threat of war. Madrid must answer: yield, or brace for what follows?"
 sandbox_fra_monarchist_2_a: "Yield to the demands"
 sandbox_fra_monarchist_2_b: "Defy them"
 sandbox_fra_monarchist_3_t: "Paris Demands the Throne"
 sandbox_fra_monarchist_3_d: "Paris demands the Andorran throne and the passes of the Pyrenees under French suzerainty. The note carries an unmistakable threat of war. Andorra must answer: yield, or brace for what follows?"
 sandbox_fra_monarchist_3_a: "Yield to the demands"
 sandbox_fra_monarchist_3_b: "Defy them"
 sandbox_fra_monarchist_4_t: "Paris Demands Mexico"
 sandbox_fra_monarchist_4_d: "Paris demands the restoration of the Mexican monarchy under a Bourbon prince. The note carries an unmistakable threat of war. Mexico must answer: yield, or brace for what follows?"
 sandbox_fra_monarchist_4_a: "Yield to the demands"
 sandbox_fra_monarchist_4_b: "Defy them"
 sandbox_fra_monarchist_5_t: "Paris Demands the East"
 sandbox_fra_monarchist_5_d: "Paris demands the second march on Moscow to restore the true order of Europe. The note carries an unmistakable threat of war. The Kremlin must answer: yield, or brace for what follows?"
 sandbox_fra_monarchist_5_a: "Yield to the demands"
 sandbox_fra_monarchist_5_b: "Defy them"
 sandbox_fra_dismantle_1_t: "The Revenge of the Republic"
 sandbox_fra_dismantle_1_d: "From the ashes of 1870 and 1914, France prepares to settle its accounts. The General Staff finalises the partition plans. Paris must decide: press our claims, or let the matter cool down?"
 sandbox_fra_dismantle_1_a: "Press our claims"
 sandbox_fra_dismantle_1_b: "Let it cool down"
 sandbox_fra_dismantle_2_t: "Paris Demands the Rhine"
 sandbox_fra_dismantle_2_d: "Paris demands the partition of Germany and the end of the Prussian menace forever. The note carries an unmistakable threat of war. Berlin must answer: yield, or brace for what follows?"
 sandbox_fra_dismantle_2_a: "Yield to the demands"
 sandbox_fra_dismantle_2_b: "Defy them"
 sandbox_fra_dismantle_3_t: "Paris Demands Albion"
 sandbox_fra_dismantle_3_d: "Paris demands the destruction of the English trade empire and the end of perfidious Albion. The note carries an unmistakable threat of war. London must answer: yield, or brace for what follows?"
 sandbox_fra_dismantle_3_a: "Yield to the demands"
 sandbox_fra_dismantle_3_b: "Defy them"
 sandbox_fra_plan_xiv_1_t: "Plan XIV"
 sandbox_fra_plan_xiv_1_d: "The old Plan XIV, dusted off in the Ecole de Guerre, names the neighbours France must break first. Paris must decide: press our claims, or let the matter cool down?"
 sandbox_fra_plan_xiv_1_a: "Press our claims"
 sandbox_fra_plan_xiv_1_b: "Let it cool down"
 sandbox_fra_plan_xiv_2_t: "Paris Demands the Pass"
 sandbox_fra_plan_xiv_2_d: "Paris demands the disarmament of the alpine passes and the neutrality of the high valleys. The note carries an unmistakable threat of war. Berne must answer: yield, or brace for what follows?"
 sandbox_fra_plan_xiv_2_a: "Yield to the demands"
 sandbox_fra_plan_xiv_2_b: "Defy them"
 sandbox_fra_plan_xiv_3_t: "Paris Demands the Alps"
 sandbox_fra_plan_xiv_3_d: "Paris demands the return of Savoy, Nice, and a free hand on the Italian border. The note carries an unmistakable threat of war. Rome must answer: yield, or brace for what follows?"
 sandbox_fra_plan_xiv_3_a: "Yield to the demands"
 sandbox_fra_plan_xiv_3_b: "Defy them"
 sandbox_ger_communist_1_t: "World Revolution"
 sandbox_ger_communist_1_d: "From the ashes of the Republic, the red flag rises again over Berlin. The world revolution will not stop at the Rhine or the Elbe. Berlin must decide: press the revolution forward, or let it cool down?"
 sandbox_ger_communist_1_a: "Press our claims"
 sandbox_ger_communist_1_b: "Let it cool down"
 sandbox_ger_communist_2_t: "Berlin Raises the Red Flag"
 sandbox_ger_communist_2_d: "Berlin demands the workers of the West rise against their masters and join the revolution. The note carries an unmistakable threat of war. The capitalist states must answer: yield, or fight."
 sandbox_ger_communist_2_a: "Yield to the demands"
 sandbox_ger_communist_2_b: "Defy them"
 sandbox_ger_communist_3_t: "Berlin Demands the Seine"
 sandbox_ger_communist_3_d: "Berlin demands the workers of France march with the revolution and the end of the imperialist order. The note carries an unmistakable threat of war. Paris must answer: yield, or fight."
 sandbox_ger_communist_3_a: "Yield to the demands"
 sandbox_ger_communist_3_b: "Defy them"
 sandbox_ger_communist_4_t: "Berlin Demands the Alps"
 sandbox_ger_communist_4_d: "Berlin demands the liberation of the Italian workers from the fascist yoke. The note carries an unmistakable threat of war. Rome must answer: yield, or fight."
 sandbox_ger_communist_4_a: "Yield to the demands"
 sandbox_ger_communist_4_b: "Defy them"
 sandbox_ger_communist_5_t: "Berlin Demands the East"
 sandbox_ger_communist_5_d: "Berlin demands the reunification of the proletarian front from the Atlantic to the Pacific. The note carries an unmistakable threat of war. The reactionary powers must answer: yield, or fight."
 sandbox_ger_communist_5_a: "Yield to the demands"
 sandbox_ger_communist_5_b: "Defy them"
 sandbox_ger_monarchist_1_t: "The Kaiser Returns"
 sandbox_ger_monarchist_1_d: "The old eagles stir in the palaces of the Reich. The restoration of the Empire demands the lands of the old order back. Berlin must decide: press our claims, or let the matter cool down?"
 sandbox_ger_monarchist_1_a: "Press our claims"
 sandbox_ger_monarchist_1_b: "Let it cool down"
 sandbox_ger_monarchist_2_t: "Berlin Demands the East"
 sandbox_ger_monarchist_2_d: "Berlin demands the end of the Bolshevik menace on the eastern frontier and the return of the old eastern lands. The note carries an unmistakable threat of war. Moscow must answer: yield, or brace for what follows?"
 sandbox_ger_monarchist_2_a: "Yield to the demands"
 sandbox_ger_monarchist_2_b: "Defy them"
 sandbox_ger_monarchist_3_t: "Berlin Demands the North"
 sandbox_ger_monarchist_3_d: "Berlin demands the return of Northern Schleswig and the old merchant empire. The note carries an unmistakable threat of war. Copenhagen must answer: yield, or brace for what follows?"
 sandbox_ger_monarchist_3_a: "Yield to the demands"
 sandbox_ger_monarchist_3_b: "Defy them"
 sandbox_ger_monarchist_4_t: "Berlin Demands the West"
 sandbox_ger_monarchist_4_d: "Berlin demands the old imperial colonies restored along the Venezuelan coast. The note carries an unmistakable threat of war. Caracas must answer: yield, or brace for what follows?"
 sandbox_ger_monarchist_4_a: "Yield to the demands"
 sandbox_ger_monarchist_4_b: "Defy them"
 sandbox_ger_monarchist_5_t: "Berlin Demands the Rhine"
 sandbox_ger_monarchist_5_d: "Berlin demands the return of the Rhine army and the reparation of the old humiliations. The note carries an unmistakable threat of war. Paris must answer: yield, or brace for what follows?"
 sandbox_ger_monarchist_5_a: "Yield to the demands"
 sandbox_ger_monarchist_5_b: "Defy them"
 sandbox_sov_white_1_t: "The White Counter-Revolution"
 sandbox_sov_white_1_d: "The revolution has been betrayed! The white generals march on Moscow to restore the old Russia. The war is not over: it has only changed sides. Moscow must decide: press the restoration, or let it cool down?"
 sandbox_sov_white_1_a: "Press our claims"
 sandbox_sov_white_1_b: "Let it cool down"
 sandbox_sov_white_2_t: "Moscow Demands the West"
 sandbox_sov_white_2_d: "The white government demands the return of the western lands torn away at Brest-Litovsk. The note carries an unmistakable threat of war. The western powers must answer: yield, or brace for what follows?"
 sandbox_sov_white_2_a: "Yield to the demands"
 sandbox_sov_white_2_b: "Defy them"
 sandbox_sov_white_3_t: "Moscow Demands the Vistula"
 sandbox_sov_white_3_d: "The white government demands the end of the Polish occupation and the return of the eastern marches. The note carries an unmistakable threat of war. Warsaw must answer: yield, or brace for what follows?"
 sandbox_sov_white_3_a: "Yield to the demands"
 sandbox_sov_white_3_b: "Defy them"
 sandbox_sov_white_4_t: "Moscow Demands the North"
 sandbox_sov_white_4_d: "The white government demands the return of the Baltic approaches and the northern frontier. The note carries an unmistakable threat of war. Helsinki must answer: yield, or brace for what follows?"
 sandbox_sov_white_4_a: "Yield to the demands"
 sandbox_sov_white_4_b: "Defy them"
 sandbox_sov_white_5_t: "Moscow Demands the Steppe"
 sandbox_sov_white_5_d: "The white government demands the restoration of the old imperial borders in the south. The note carries an unmistakable threat of war. The border states must answer: yield, or brace for what follows?"
 sandbox_sov_white_5_a: "Yield to the demands"
 sandbox_sov_white_5_b: "Defy them"
 sandbox_jap_communist_1_t: "The Red Rising Sun"
 sandbox_jap_communist_1_d: "The proletariat has thrown off the Emperor's yoke and raises the red flag over the Pacific. The pan-Asian revolution will not stop at the China Sea. Tokyo must decide: press the revolution forward, or let it cool down?"
 sandbox_jap_communist_1_a: "Press our claims"
 sandbox_jap_communist_1_b: "Let it cool down"
 sandbox_jap_communist_2_t: "Tokyo Raises the Red Flag"
 sandbox_jap_communist_2_d: "Tokyo demands the end of Chinese feudalism and the alliance of the Asian masses. The note carries an unmistakable threat of war. The old order must answer: yield, or fight."
 sandbox_jap_communist_2_a: "Yield to the demands"
 sandbox_jap_communist_2_b: "Defy them"
 sandbox_jap_communist_3_t: "Tokyo Demands the Liberation"
 sandbox_jap_communist_3_d: "Tokyo demands the liberation of the Asian peoples from the colonial and capitalist yoke. The note carries an unmistakable threat of war. The imperialists must answer: yield, or fight."
 sandbox_jap_communist_3_a: "Yield to the demands"
 sandbox_jap_communist_3_b: "Defy them"
 sandbox_jap_communist_4_t: "Tokyo Demands the East"
 sandbox_jap_communist_4_d: "Tokyo demands the workers of the West join the pan-Asian revolution against capital. The note carries an unmistakable threat of war. The capitalists must answer: yield, or fight."
 sandbox_jap_communist_4_a: "Yield to the demands"
 sandbox_jap_communist_4_b: "Defy them"
 sandbox_ita_communist_1_t: "The Red Roman Revolution"
 sandbox_ita_communist_1_d: "The workers of Italy have raised the red flag over the Eternal City. The revolution turns its eyes to the enemies of capital. Rome must decide: press the revolution forward, or let it cool down?"
 sandbox_ita_communist_1_a: "Press our claims"
 sandbox_ita_communist_1_b: "Let it cool down"
 sandbox_ita_communist_2_t: "Rome Raises the Red Flag"
 sandbox_ita_communist_2_d: "Rome demands the end of the capitalist order in the West and the brotherhood of workers. The note carries an unmistakable threat of war. The capitalists must answer: yield, or fight."
 sandbox_ita_communist_2_a: "Yield to the demands"
 sandbox_ita_communist_2_b: "Defy them"
 sandbox_ita_communist_3_t: "Rome Demands the Sea"
 sandbox_ita_communist_3_d: "Rome demands the liberation of the workers of Africa from the colonial yoke. The note carries an unmistakable threat of war. The colonial powers must answer: yield, or fight."
 sandbox_ita_communist_3_a: "Yield to the demands"
 sandbox_ita_communist_3_b: "Defy them"
 sandbox_ita_communist_4_t: "Rome Demands the Balkans"
 sandbox_ita_communist_4_d: "Rome demands the liberation of the Balkan workers from the feudal and monarchist yoke. The note carries an unmistakable threat of war. The monarchies must answer: yield, or fight."
 sandbox_ita_communist_4_a: "Yield to the demands"
 sandbox_ita_communist_4_b: "Defy them"
 sandbox_eng_communist_1_t: "The Red Union Jack"
 sandbox_eng_communist_1_d: "The revolution has triumphed in the streets of London. The red flag flies over the Union; the world revolution begins at home and spreads abroad. London must decide: press the revolution forward, or let it cool down?"
 sandbox_eng_communist_1_a: "Press our claims"
 sandbox_eng_communist_1_b: "Let it cool down"
 sandbox_eng_communist_2_t: "London Raises the Red Flag"
 sandbox_eng_communist_2_d: "London demands the emancipation of the workers of the world from the chains of capital and empire. The note carries an unmistakable threat of war. The capitalist powers must answer: yield, or fight."
 sandbox_eng_communist_2_a: "Yield to the demands"
 sandbox_eng_communist_2_b: "Defy them"
 sandbox_eng_communist_3_t: "London Demands the Home"
 sandbox_eng_communist_3_d: "London demands the liberation of the true home of Marxism and the end of the last empires. The note carries an unmistakable threat of war. The reactionaries must answer: yield, or fight."
 sandbox_eng_communist_3_a: "Yield to the demands"
 sandbox_eng_communist_3_b: "Defy them"
 sandbox_eng_communist_4_t: "London Demands the Revolution"
 sandbox_eng_communist_4_d: "London demands the liberation of the American workers from the rule of Wall Street. The note carries an unmistakable threat of war. The capitalists must answer: yield, or fight."
 sandbox_eng_communist_4_a: "Yield to the demands"
 sandbox_eng_communist_4_b: "Defy them"
